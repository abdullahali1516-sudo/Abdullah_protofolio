<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdullah Islam Mahmoud – AI Automation Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500&family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12110e;--panel:#1b1a16;--line:#34312a;--paper:#f3ecdc;--sand:#d9ccb0;--mute:#a79f8b;--cream:#f3ecdc;--cream2:#ebe2cd;--rule:#d6c9ab;--burnt:#a8480f;--burnt2:#8c3a09;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--paper);font:400 17px/1.65 "Hanken Grotesk",system-ui,sans-serif}
[lang=ar] body,[lang=ar] h1,[lang=ar] h2,[lang=ar] h3,[lang=ar] button{font-family:"Tajawal",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;max-width:1080px;margin:0 auto}
header nav{display:flex;gap:22px;align-items:center;font-size:15px}
header nav a{text-decoration:none;color:var(--mute)}
header nav a:hover{color:var(--paper)}
.lang{background:none;border:1px solid var(--line);color:var(--paper);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.lang:hover{border-color:var(--sand)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:78vh;padding:30px 0 70px}
.hero h1{font-size:clamp(46px,8vw,104px)}
.hero p{max-width:34em;color:#cfc9ba;margin:26px 0 34px;font-size:19px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:99px;text-decoration:none;font-weight:500;border:1px solid var(--sand);cursor:pointer;font:inherit;font-weight:500}
.btn.main{background:var(--sand);color:var(--ink)}
.btn.main:hover{background:var(--paper)}
.btn.ghost{background:none;color:var(--paper)}
.btn.ghost:hover{background:rgba(212,196,160,.1)}
.scene{perspective:900px;height:360px;display:flex;align-items:center;justify-content:center}
.stack{position:relative;width:300px;height:310px;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-24deg);transition:transform .25s ease-out}
.node{position:absolute;width:236px;padding:16px 20px 16px 26px;background:var(--cream);color:var(--ink);border-radius:14px;font-size:15px;box-shadow:0 26px 36px -18px rgba(0,0,0,.75)}
.node::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;border-radius:50%;background:var(--burnt);transform:translateY(-50%)}
.node b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin-bottom:2px;color:var(--ink)}
.node span{color:#5d5747;font-size:14px}
.n1{top:0;left:0;transform:translateZ(0)}.n2{top:112px;left:32px;transform:translateZ(45px);background:var(--burnt)}.n2 b{color:#fff8ea}.n2 span{color:#f5dcc6}.n2::before{background:var(--cream)}.n3{top:224px;left:64px;transform:translateZ(90px)}
section{padding:90px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(34px,5vw,58px);margin-bottom:40px;max-width:14em}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;margin:0;padding:0;list-style:none}
.svc li{padding:20px 0;border-bottom:1px solid var(--line)}
.svc strong{display:block;font-size:19px;font-weight:500}
.svc span{color:var(--mute);font-size:16px}
.ind{margin-top:34px;color:#cfc9ba}
.work{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px}
.proj.big{border-color:rgba(212,196,160,.4)}
.proj h3{font-size:30px;margin-bottom:14px}
.proj p{color:#cfc9ba;margin:0 0 14px}
.proj ul{margin:18px 0 0;padding-inline-start:20px;color:var(--mute)}
.proj li{margin:6px 0}
.about{max-width:40em;font-size:19px;color:#e3ddcc}
.about p{margin:0 0 20px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.contact p{color:#cfc9ba;max-width:26em}
.links{display:grid;gap:8px;margin-top:26px}
.links a{color:var(--sand)}
.f{display:grid;gap:14px}
.f input,.f textarea,.f select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--paper);padding:14px 16px;font:inherit}
.f textarea{min-height:130px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--sand);outline:none}
.f .bad{border-color:#c98a7a}
footer{padding:36px 24px 50px;text-align:center;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
#intro{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;transition:opacity .7s ease,visibility .7s}
#intro.off{opacity:0;visibility:hidden}
#intro .nm{direction:ltr;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(32px,7vw,76px);letter-spacing:-.02em;display:flex;flex-wrap:wrap;justify-content:center;padding:0 20px}
#intro .nm i{font-style:normal;display:inline-block;opacity:0;transform:translateY(40px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
#intro .tg{color:var(--sand);opacity:0;animation:fade 1s .2s forwards;font-size:19px}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media(max-width:780px){
.hero,.work,.contact{grid-template-columns:1fr}
.svc{grid-template-columns:1fr}
.scene{height:300px}.hero{min-height:0}
header nav a{display:none}
section{padding:64px 0}
}
.id{display:flex;flex-direction:column;gap:2px;margin-bottom:26px;padding-inline-start:14px;border-inline-start:2px solid var(--sand)}
.id strong{font-size:18px;font-weight:500;letter-spacing:.01em}
.id span{color:var(--sand);font-size:15px}
.btn{transition:background .2s,border-color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.main{background:var(--burnt);border-color:var(--burnt);color:#fff8ea}
.btn.main:hover{background:var(--burnt2);border-color:var(--burnt2)}
.links .btn{justify-self:start}
#work,#services,#about{background:var(--cream);color:var(--ink);box-shadow:0 0 0 100vmax var(--cream);clip-path:inset(0 -100vmax);border-top-color:transparent}
#services{background:var(--cream2);box-shadow:0 0 0 100vmax var(--cream2)}
#work :focus-visible,#services :focus-visible,#about :focus-visible{outline-color:var(--ink)}
#work .proj{background:#faf5e8;border-color:var(--rule);transition:transform .25s,box-shadow .25s}
#work .proj:hover{transform:translateY(-3px);box-shadow:0 18px 30px -20px rgba(18,17,14,.45)}
#work .proj.big{border-color:var(--ink)}
#work .proj p{color:#3f3a2f}
#work .proj ul{color:#5d5747}
#services .svc li{border-bottom-color:var(--rule)}
#services .svc span{color:#5d5747}
#services .ind{color:#3f3a2f}
#about .about{color:#2a261e}
footer{background:var(--ink)}
.f{max-height:0;opacity:0;visibility:hidden;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,visibility .5s}
.f.open{max-height:900px;opacity:1;visibility:visible}
.aboutgrid{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:center}
.pwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.photo{all:unset;cursor:pointer;position:relative;display:block;width:100%;max-width:310px;aspect-ratio:4/5;transition:transform .2s ease-out}
.photo:focus-visible{outline:2px solid var(--ink);outline-offset:8px;border-radius:22px}
.photo .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.photo.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#26241e,var(--ink));color:var(--paper);box-shadow:0 30px 40px -24px rgba(18,17,14,.6)}
.face.back{transform:rotateY(180deg);padding:28px;gap:8px;border:1px solid var(--sand)}
.face.back strong{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;line-height:1.15}
.face.back em{font-style:normal;color:var(--sand)}
.face.back small{color:#cfc9ba;font-size:15px;margin-top:8px}
.face.front b{font-family:"Bricolage Grotesque",sans-serif;font-size:84px;color:var(--sand)}
.face.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.front img:not([src]){display:none}
.face.front img[src]~b{display:none}
.photo::after{content:"";position:absolute;inset:0;border-radius:22px;border:2px solid var(--ink);opacity:0;pointer-events:none}
.photo.pulse::after{animation:ring .6s ease-out}
@keyframes ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.14)}}
.hint{margin:0;color:#6b6455;font-size:14px}
@media(max-width:780px){.aboutgrid{grid-template-columns:1fr;gap:34px}}
@media(prefers-reduced-motion:reduce){.photo,.photo .in{transition:none}}
@media(prefers-reduced-motion:reduce){#intro{display:none}.stack{transition:none}html{scroll-behavior:auto}}

.face.back{background:var(--burnt);border:none}
.face.back strong{color:#fff8ea}
.face.back em{color:#f5dcc6}
.face.back small{color:#fff8ea}
section h2::before{content:"";display:block;width:46px;height:4px;border-radius:2px;background:var(--burnt);margin-bottom:18px}
#work .proj.big{border-top:4px solid var(--burnt)}
.id{border-inline-start-color:var(--burnt)}
.face.front{box-shadow:0 30px 40px -24px rgba(18,17,14,.6),inset 0 0 0 1px rgba(243,236,220,.25)}
</style>
</head>

  <div class="tg" id="tg"></div>
</div>

<header>
